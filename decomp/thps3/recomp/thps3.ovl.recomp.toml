# N64Recomp config for THPS3 main + the 16 front-end overlays (relocatable sections). Same as thps3.recomp.toml
# except for the symbols file and the code blob, both produced by `make recomp-ovl` (decomp/common/overlay_syms.py).
# Output: build/recomp/ovl_funcs (funcs_*.c, funcs.h, lookup.cpp, recomp_overlays.inl).
# N64Recomp config for THPS3 (N64, U) - same shape as the THPS1 config.
# Inputs are generated locally from the user's ROM (make recomp-inputs):
#   build/thps3.codeblob.bin  ROM[0:0x1000] | boot segment | ERZ-inflated main image
#   recomp/thps3.syms.toml    sections + function boundaries (committed, addresses only)
[input]
entrypoint = 0x80000400
symbols_file_path = "thps3.ovl.syms.toml"
rom_file_path = "../build/thps3.ovl.codeblob.bin"
output_func_path = "../build/recomp/ovl_funcs"

[patches]
# PS1 GTE (COP2) leftovers in func_80045B00 (called from 3 places, as in THPS2; the VR4300 has no COP2
# and libultra treats a CpU exception for COP2 as fatal, so these paths are dead or have
# an empty loop count on hardware). N64Recomp cannot translate COP2: patch each of the
# 6 mtc2 and 3 mfc2 to nop, as THPS1 did for its 3 mfc2. No `ctc2` exists in THPS3.
[[patches.instruction]]
func = "func_80045B00"
vram = 0x80045D38   # mtc2 a1,$25
value = 0x00000000
[[patches.instruction]]
func = "func_80045B00"
vram = 0x80045D3C   # mtc2 a2,$26
value = 0x00000000
[[patches.instruction]]
func = "func_80045B00"
vram = 0x80045D40   # mtc2 a3,$27
value = 0x00000000
[[patches.instruction]]
func = "func_80045B00"
vram = 0x80045D44   # mtc2 a0,$9
value = 0x00000000
[[patches.instruction]]
func = "func_80045B00"
vram = 0x80045D48   # mtc2 v1,$10
value = 0x00000000
[[patches.instruction]]
func = "func_80045B00"
vram = 0x80045D4C   # mtc2 v0,$11
value = 0x00000000
[[patches.instruction]]
func = "func_80045B00"
vram = 0x80045D64   # mfc2 t0,$25
value = 0x00000000
[[patches.instruction]]
func = "func_80045B00"
vram = 0x80045D68   # mfc2 t1,$26
value = 0x00000000
[[patches.instruction]]
func = "func_80045B00"
vram = 0x80045D6C   # mfc2 t2,$27
value = 0x00000000
